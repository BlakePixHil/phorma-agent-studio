@if (active(); as dialog) {
  <div class="phorma-confirm" role="presentation" (click)="confirmDialog.cancel()">
    <section
      class="phorma-confirm__card"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="dialog.title"
      (click)="$event.stopPropagation()"
    >
      <header class="phorma-confirm__header">
        <div>
          <h2>{{ dialog.title }}</h2>
          <p>{{ dialog.message }}</p>
        </div>
      </header>

      @if (dialog.input; as input) {
        <div class="phorma-confirm__field">
          <input
            type="text"
            class="phorma-confirm__input"
            [value]="dialog.inputValue"
            [attr.placeholder]="input.placeholder"
            [attr.aria-label]="input.label ?? dialog.title"
            [attr.maxlength]="input.maxLength"
            [required]="input.required ?? true"
            (input)="onInput($event)"
            (keydown)="onInputKeydown($event)"
          />
        </div>
      }

      <footer class="phorma-confirm__actions">
        <p-button
          styleClass="phorma-confirm__btn"
          [text]="true"
          severity="secondary"
          size="small"
          [label]="dialog.cancelLabel"
          (onClick)="confirmDialog.cancel()"
        />
        @if (dialog.alternateLabel) {
          <p-button
            styleClass="phorma-confirm__btn"
            [outlined]="true"
            size="small"
            [label]="dialog.alternateLabel"
            (onClick)="confirmDialog.alternate()"
          />
        }
        <p-button
          styleClass="phorma-confirm__btn"
          size="small"
          [disabled]="confirmDisabled()"
          [severity]="dialog.tone === 'danger' ? 'danger' : undefined"
          [label]="dialog.confirmLabel"
          (onClick)="confirmDialog.accept()"
        />
      </footer>
    </section>
  </div>
}
