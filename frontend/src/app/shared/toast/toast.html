<!--
  Labelled "Alerts", not "Notifications". The toolbar bell is now a real
  Notifications surface with its own accessible name, and two landmarks answering
  to the same word is a landmark list a screen reader user cannot navigate.
-->
<div class="phorma-toast-region" role="region" aria-live="polite" aria-label="Alerts">
  @for (t of entries(); track t.id) {
    <div
      class="phorma-toast"
      [class.phorma-toast--success]="t.severity === 'success'"
      [class.phorma-toast--warning]="t.severity === 'warning'"
      [class.phorma-toast--error]="t.severity === 'error'"
      role="alert"
    >
      <!--
        Tabler, not PrimeIcons. This carried `pi pi-check-circle` and friends,
        which rendered as EMPTY BOXES: `primeicons` is uninstalled, so the three
        `pi-*` classes matched no font glyph. The dismiss and copy buttons beside
        it were already `ti`, which is why nobody noticed the severity icon was a
        blank square in every toast the app has ever shown.
      -->
      <i
        class="ti phorma-toast__icon"
        [class.ti-circle-check]="t.severity === 'success'"
        [class.ti-alert-triangle]="t.severity === 'warning'"
        [class.ti-circle-x]="t.severity === 'error'"
        aria-hidden="true"
      ></i>
      <div class="phorma-toast__body">
        <p class="phorma-toast__summary">{{ t.summary }}</p>
        @if (t.detail) {
          <p class="phorma-toast__detail">{{ t.detail }}</p>
        }
        @if (t.action; as action) {
          <button type="button" class="phorma-toast__cta" (click)="runAction(t, action)">
            {{ action.label }}
          </button>
        }
      </div>
      <div class="phorma-toast__actions">
        @if (t.severity === 'error' || t.severity === 'warning') {
          <button
            type="button"
            class="phorma-toast__action"
            (click)="copy(t)"
            [attr.aria-label]="copiedId() === t.id ? 'Message copied' : 'Copy message'"
            [title]="copiedId() === t.id ? 'Copied' : 'Copy message'"
          >
            <i
              class="ti"
              [class.ti-copy]="copiedId() !== t.id"
              [class.ti-check]="copiedId() === t.id"
              aria-hidden="true"
            ></i>
          </button>
        }
        <button
          type="button"
          class="phorma-toast__action"
          (click)="toast.dismiss(t.id)"
          aria-label="Dismiss notification"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  }
</div>
