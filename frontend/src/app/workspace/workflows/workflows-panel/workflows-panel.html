<div class="phorma-workflows">
  <!-- Built-in templates -->
  <div class="phorma-workflows__section-label">Templates</div>
  <ul class="phorma-workflows__list">
    @for (template of templates; track template.id) {
      <li>
        <button
          type="button"
          class="phorma-workflows__item"
          (click)="openTemplate(template)"
          [title]="template.description"
        >
          <i [class]="template.icon" aria-hidden="true"></i>
          <span class="phorma-workflows__meta">
            <span class="phorma-workflows__name">{{ template.label }}</span>
            <span class="phorma-workflows__date">Template</span>
          </span>
        </button>
      </li>
    }
  </ul>

  <div class="phorma-workflows__section-label">Saved</div>
  @if (workflow.library().length > 0) {
    <ul class="phorma-workflows__list">
      @for (spec of workflow.library(); track spec.id) {
        <li>
          <button type="button" class="phorma-workflows__item" (click)="open(spec)">
            <i class="ti ti-topology-star-3" aria-hidden="true"></i>
            <span class="phorma-workflows__meta">
              <span class="phorma-workflows__name">{{ spec.name }}</span>
              <span class="phorma-workflows__date">{{ spec.savedAt | date: 'MMM d, h:mm a' }}</span>
            </span>
            <span class="phorma-workflows__row-actions">
              <span
                role="button"
                tabindex="0"
                class="phorma-workflows__row-btn phorma-workflows__history"
                aria-label="View version history"
                title="Version history"
                (click)="openHistory($event, spec)"
                (keydown.enter)="openHistory($event, spec)"
              >
                <i class="ti ti-history" aria-hidden="true"></i>
              </span>
              <span
                role="button"
                tabindex="0"
                class="phorma-workflows__row-btn phorma-workflows__rename"
                aria-label="Rename workflow"
                title="Rename"
                (click)="rename($event, spec)"
                (keydown.enter)="rename($event, spec)"
              >
                <i class="ti ti-edit" aria-hidden="true"></i>
              </span>
              <span
                role="button"
                tabindex="0"
                class="phorma-workflows__row-btn phorma-workflows__row-btn--danger phorma-workflows__delete"
                aria-label="Delete workflow"
                title="Delete"
                (click)="remove($event, spec)"
                (keydown.enter)="remove($event, spec)"
              >
                <i class="ti ti-trash" aria-hidden="true"></i>
              </span>
            </span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <div class="phorma-workflows__placeholder">
      <i class="ti ti-topology-star-3" aria-hidden="true"></i>
      <p>No saved workflows yet.<br />Save one with Ctrl+S.</p>
    </div>
  }
</div>
