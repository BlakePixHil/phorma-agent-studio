@if (session.pendingReview(); as txn) {
  <div class="phorma-ai-review" role="status">
    <i class="ti ti-sparkles phorma-ai-review__icon" aria-hidden="true"></i>
    <span class="phorma-ai-review__text">
      AI edited the canvas
      <span class="phorma-ai-review__count">({{ txn.ops.length }} change{{ txn.ops.length === 1 ? '' : 's' }})</span>
    </span>
    <button type="button" class="phorma-ai-review__btn" (click)="session.revert()">
      <i class="ti ti-arrow-back-up" aria-hidden="true"></i> Revert
    </button>
    <button type="button" class="phorma-ai-review__btn phorma-ai-review__btn--primary phorma-btn-shimmer" (click)="session.keep()">
      <i class="ti ti-check" aria-hidden="true"></i> <span>Keep</span>
    </button>
  </div>
}
