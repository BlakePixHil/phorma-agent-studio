@if (agent(); as node) {
  <div class="phorma-prompt">
    <header class="phorma-prompt__head">
      <i class="{{ node.icon }}" aria-hidden="true"></i>
      <span class="phorma-prompt__name">{{ node.name }}</span>
      <button
        type="button"
        pButton
        severity="secondary"
        [text]="true"
        size="small"
        class="phorma-panel-icon-btn"
        [disabled]="generating()"
        (click)="generatePrompt()"
        [title]="node.data.prompt.trim() ? 'Improve this prompt with AI' : 'Generate a prompt with AI'"
        aria-label="Generate prompt with AI"
      >
        <i
          class="ti"
          [class.ti-sparkles]="!generating()"
          [class.ti-loader-2]="generating()"
          [class.phorma-icon-spin]="generating()"
          aria-hidden="true"
        ></i>
      </button>
      <button
        type="button"
        pButton
        severity="secondary"
        [text]="true"
        size="small"
        class="phorma-panel-icon-btn"
        (click)="togglePreview()"
        [title]="previewing() ? 'Edit markdown' : 'Preview markdown'"
        [attr.aria-label]="previewing() ? 'Edit markdown' : 'Preview markdown'"
      >
        <i class="ti" [class.ti-eye]="!previewing()" [class.ti-pencil]="previewing()" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        pButton
        severity="secondary"
        [text]="true"
        size="small"
        class="phorma-panel-icon-btn"
        title="Expand to full view — prompt library and a bigger editor"
        aria-label="Expand to full view"
        (click)="expand()"
      >
        <i class="ti ti-arrows-maximize" aria-hidden="true"></i>
      </button>
    </header>

    <!-- Markdown system prompt -->
    <section class="phorma-prompt__section phorma-prompt__section--grow">
      <label class="phorma-prompt__label" for="prompt-editor">System prompt (markdown)</label>
      @if (previewing()) {
        <div class="phorma-prompt__preview selectable" [innerHTML]="previewHtml()"></div>
      } @else {
        <textarea
          pTextarea
          id="prompt-editor"
          class="phorma-prompt__editor"
          spellcheck="false"
          [value]="node.data.prompt"
          (input)="onPromptInput($event)"
          placeholder="# Role&#10;&#10;You are…&#10;&#10;# Task&#10;&#10;{{ '{{input}}' }}"
        ></textarea>
      }
      <p class="phorma-prompt__hint">
        <code>{{ '{{input}}' }}</code> interpolates the incoming task.
      </p>
    </section>

    <!-- Skills, model, reliability and capabilities — shared with the dialog -->
    <app-agent-config [agent]="node" scope="panel" />
  </div>
} @else {
  <div class="phorma-prompt__placeholder">
    <i class="ti ti-message-2" aria-hidden="true"></i>
    <p>Select an agent to edit its prompt.</p>
    <button
      type="button"
      pButton
      severity="secondary"
      [outlined]="true"
      size="small"
      class="phorma-prompt__browse-btn"
      title="Browse the prompt library"
      aria-label="Browse the prompt library"
      (click)="expand()"
    >
      <i class="ti ti-books" aria-hidden="true"></i>
      <span>Browse prompt library</span>
    </button>
  </div>
}
