<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="utf-8" />
    <title>Phorma Agent Studio</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Nunito — primary UI font (loaded early so first paint uses it). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Native desktop behaviour: suppress the browser's page context menu
      // (Back / Reload / Inspect) over app chrome, but KEEP it where the user
      // is working with text - editable fields (Cut / Copy / Paste and the
      // spelling suggestions) and selected text in a `.selectable` region
      // (Copy). Tauri does not disable the WebView2 menu itself; this script
      // is the only gate. Components with their own PrimeNG context menu
      // (canvas, tab strips) preventDefault on their targets independently.
      window.addEventListener('contextmenu', (e) => {
        const target = e.target instanceof Element ? e.target : null;
        if (target?.closest('input, textarea, [contenteditable="true"], [contenteditable=""]')) {
          return;
        }
        const selection = window.getSelection();
        if (
          target?.closest('.selectable') &&
          selection &&
          !selection.isCollapsed &&
          selection.toString().trim() !== ''
        ) {
          return;
        }
        e.preventDefault();
      });

      // Disable ctrl+wheel page zoom so the canvas owns zooming.
      window.addEventListener(
        'wheel',
        (e) => {
          if (e.ctrlKey) e.preventDefault();
        },
        { passive: false }
      );

      // Block browser zoom keyboard shortcuts (Ctrl +/-/0) at the document level.
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
          e.preventDefault();
        }
      });

      // ── Desktop shell: suppress browser accelerator keys ────────────────
      // In the built app (Tauri/WebView2) the browser's own shortcuts must
      // never surface — no print preview (Ctrl+P), no find bar (Ctrl+F), no
      // page reload (Ctrl+R / F5), no view-source, etc. preventDefault on
      // keydown stops the WebView's default handling but does NOT stop
      // propagation, so the app's own handlers (Ctrl+P palette, F5 run
      // controls) still receive the event. Guarded to Tauri so browser
      // previews (`ng serve`) keep normal dev shortcuts like reload.
      if ('__TAURI_INTERNALS__' in window) {
        window.addEventListener(
          'keydown',
          (e) => {
            const ctrl = e.ctrlKey || e.metaKey;
            const key = e.key.toLowerCase();
            // Browser-owned function keys: reload / find-next / caret browsing.
            if (['f5', 'f3', 'f7'].includes(key)) e.preventDefault();
            if (!ctrl) return;
            // Ctrl/Cmd + browser accelerators. The app repurposes some of
            // these (P = palette, S = save, N = new); preventDefault here is
            // the safety net so the browser NEVER handles them, even if an
            // app-level handler regresses.
            if (['p', 'f', 'r', 'j', 'o', 'u', 'h', 'l', 'k', 'e', 'd', 't', 'w'].includes(key)) {
              e.preventDefault();
            }
          },
          { capture: true }
        );
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
