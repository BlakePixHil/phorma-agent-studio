# Release pipeline — builds signed installers + updater artifacts for all
# desktop platforms, publishes a GitHub Release, and syncs everything to the
# Cloudflare R2 release bucket so the in-app updater and download website can
# serve them.
#
# Triggered by version tags (v*). The version sync script (`scripts/release.mjs`)
# creates the tag; this workflow does the rest.
#
# Required repository secrets (set once in GitHub repo settings):
#   TAURI_SIGNING_PRIVATE_KEY          — contents of backend/src-tauri/.tauri/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password chosen during `tauri signer generate`
#   CLOUDFLARE_API_TOKEN               — API token with Workers R2 Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID              — Cloudflare account id
#
# Optional (env-gated; skipped when absent so v1 ships without paid certs):
#   AZURE_TRUSTED_SIGNING_*             — Windows code signing (see tauri-action docs)
#   APPLE_CERTIFICATE                   — base64 .p12 (macOS Developer ID)
#   APPLE_CERTIFICATE_PASSWORD          — .p12 password
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID — notarization credentials
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build + publish per-platform installers and updater artifacts ───────
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (frontend)
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Install dependencies (backend)
        run: npm install --legacy-peer-deps
        working-directory: backend

      - name: Install dependencies (cloud)
        run: npm install --legacy-peer-deps
        working-directory: cloud

      - name: Install dependencies (engine)
        run: npm install --legacy-peer-deps
        working-directory: engine

      # Linux needs webkit2gtk and other system deps for Tauri.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-action builds, signs the updater artifacts with the signing
      # secrets, creates the GitHub Release, and emits latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── OS code signing (DISABLED until certs are purchased) ─────────
          # GOTCHA: `${{ secrets.X }}` for a missing secret yields an EMPTY
          # STRING, and Tauri's bundler treats a defined-but-empty
          # APPLE_CERTIFICATE as "sign with this" -> SecKeychainItemImport
          # fails and the whole build errors. So these must stay fully
          # commented out (not env-gated) until real values exist.
          #
          # Windows (Azure Trusted Signing):
          #   AZURE_TRUSTED_SIGNING_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          #   AZURE_TRUSTED_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          #   AZURE_TRUSTED_SIGNING_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          #   AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          #   AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          #
          # macOS (Developer ID + notarization):
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Pin the Tauri project dir — auto-detection has crawled into mcp/
          # on Linux runners and resolved beforeBuildCommand's ../frontend to
          # mcp/frontend, killing the build.
          projectPath: backend
          tagName: ${{ github.ref_name }}
          releaseName: 'Phorma Agent Studio ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download. The app will auto-update if already installed.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # ── Sync release artifacts to Cloudflare R2 ─────────────────────────────
  # Runs after all platform builds succeed. Copies installers, .sig files, and
  # latest.json from the GitHub Release into R2 under stable/{version}/ and
  # updates stable/latest.json + stable/releases.json.
  publish-r2:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GOTCHA: VERSION must be set HERE, not only on the sync step below.
          # Without it `gh release download ""` silently falls back to the
          # release marked "Latest" on GitHub — which for prerelease chains is
          # an OLD version — and the updater manifest gets poisoned.
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber
          echo "Downloaded files:"
          ls -la release-assets/

      - name: Sync to R2 and update manifests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/publish-r2.mjs "$VERSION" release-assets
